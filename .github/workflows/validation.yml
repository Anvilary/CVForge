name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cvforge-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_SITE_URL: https://cvforge.example.invalid

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.5.2
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository policy
        run: |
          pnpm check:em-dash
          pnpm check:commits

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.CI_SITE_URL }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Persistence, import, PDF, accessibility, and privacy smoke
        run: >-
          pnpm exec playwright test --project=chromium
          tests/e2e/data-integrity.spec.ts
          tests/e2e/builder-import.spec.ts
          tests/e2e/pdf-text.spec.ts
          tests/e2e/accessibility.spec.ts
          tests/e2e/privacy.spec.ts
